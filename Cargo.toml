[package]
name = "sbxctl"
version = "1.0.0"
edition = "2024"
description = "High-performance Rust CLI for remote SSH operations"
authors = ["Craig Brown <craigbrowndev@gmail.com>"]
license = "MIT"
repository = "https://github.com/saidake/sbxctl"
homepage = "https://github.com/saidake/sbxctl"
readme = "README.md"
keywords = ["ssh", "cli", "remote", "automation", "deployment", "patch", "file-transfer", "system-administration"]
categories = ["command-line-utilities", "system-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ssh2 = "0.9"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
rpassword = "7.2"
once_cell = "1.21.3"
env_logger = "0.11"
ansi_term = "0.12.1"

[build-dependencies]
# If needed for build scripts