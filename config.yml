# Common config (Optional, applies for all servers)
common:
  server:
    connect_timeout: 60s  
    max_channels_per_session: 200
    max_sessions_per_server: 2000
    session_acquire_timeout: 30s
    max_session_lifetime: 10m

var-map:
  ASSETS_ROOT: "/mnt/c/Users/saidake/Desktop/DevProjects/rsctl/AAA/assets"
group-map:
  dev: ["test-server1", "test-server2"]

servers:
  - name: "test-server1"
    host: "192.168.75.128"
    user: "test99"
    ssh-port: 22
    password: "testpwd"
    connect_timeout: 60s  # You can overwrite common config in this command.
  - name: "test-server2"
    host: "192.168.75.129"
    user: "test99"
    ssh-port: 22
    password: "testpwd"
    connect_timeout: 60s  # You can overwrite common config in this command.
configs:   
  - name: "dev-deploy"   
    
    # Common config
    use-sudo: true    
    use-rsync: true
    silent: true
    
    upload:
      - properties-file: "AAA/config/path-mapping.properties"

        # Specify servers or groups.
        # target-servers: ["test-server1","test-server2"] 
        target-groups: ["dev"]
        
        # You can overwrite common config in this command.
        # use-sudo: false
        # use-rsync: false
        # silent: false

    patch:
      - local-path: "AAA/assets/example-patch.txt"
        remote-upload: "/tmp/example-patch.txt.upload"
        remote-path: "~/examples/example-patch-remote.txt"
        remote-backup: "/tmp/example-patch-remote.txt.bak"
        # target-servers: ["test-server1","test-server2"]  
        target-groups: ["dev"]

    execute:
      - remote-path: "~"
        scripts: 
          - "AAA/assets/example-bash1.sh"
          - "AAA/assets/example-bash2.sh"
        mode: sync
        # target-servers: ["test-server1","test-server2"]  
        target-groups: ["dev"]

