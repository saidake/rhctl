# Build and Release
#
# Cross-platform release build for rhctl. Compiles release binaries for
# Linux (x86_64 musl) and macOS (x86_64 and arm64), attaches them to the
# GitHub Release for the pushed tag, then updates saidake/homebrew-rhctl.
#
# Triggered on push of a git tag matching v* (e.g. v1.0.0, v0.2.1).
# Release notes are written manually (CI does not generate or overwrite them).
# Homebrew tap updates require repository secret GIT_TOKEN (Contents: write
# on saidake/homebrew-rhctl).

name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl]

    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
        working-directory: .
      - name: Add Linux target
        run: rustup target add ${{ matrix.target }}
      - name: Build ${{ matrix.target }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename Linux binary
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mv target/${{ matrix.target }}/release/rhctl ../rhctl-v${VERSION}-linux-x86_64
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhctl-linux
          path: rhctl-v*-linux-x86_64

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: main
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Add macOS targets
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin
      - name: Build macOS x86_64
        run: cargo build --release --target x86_64-apple-darwin
      - name: Build macOS ARM64
        run: cargo build --release --target aarch64-apple-darwin
      - name: Rename macOS binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mv target/x86_64-apple-darwin/release/rhctl ../rhctl-v${VERSION}-macos-x86_64
          mv target/aarch64-apple-darwin/release/rhctl ../rhctl-v${VERSION}-macos-arm64
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rhctl-macos
          path: |
            rhctl-v*-macos-x86_64
            rhctl-v*-macos-arm64

  release:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    environment: homebrew
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: rhctl-linux
          path: dist

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: rhctl-macos
          path: dist

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          TITLE="rhctl ${TAG}"
          LINUX="dist/rhctl-v${VERSION}-linux-x86_64"
          MACOS_X64="dist/rhctl-v${VERSION}-macos-x86_64"
          MACOS_ARM64="dist/rhctl-v${VERSION}-macos-arm64"

          ls -la dist

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$LINUX" "$MACOS_X64" "$MACOS_ARM64" --clobber
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "" \
              "$LINUX" \
              "$MACOS_X64" \
              "$MACOS_ARM64"
          fi

      - name: Update Homebrew tap
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GIT_TOKEN:-}" ]]; then
            echo "GIT_TOKEN secret is not set; skipping Homebrew tap update" >&2
            exit 1
          fi

          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          chmod +x scripts/update-homebrew-formula.sh

          git clone --depth 1 \
            "https://x-access-token:${GIT_TOKEN}@github.com/saidake/homebrew-rhctl.git" \
            homebrew-rhctl

          ./scripts/update-homebrew-formula.sh \
            "$VERSION" \
            dist \
            homebrew-rhctl/Formula/rhctl.rb

          cd homebrew-rhctl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rhctl.rb
          if git diff --staged --quiet; then
            echo "Homebrew formula already up to date for v${VERSION}"
            exit 0
          fi
          git commit -m "rhctl ${VERSION}"
          git push origin HEAD:main
