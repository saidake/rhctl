# Build and Release
#
# Cross-platform release build for rsctl. Compiles release binaries for
# Linux (x86_64 musl) and macOS (x86_64 and arm64), then uploads them as
# workflow artifacts named by version and platform.
#
# Triggered on push of a git tag matching v* (e.g. v1.0.0, v0.2.1).

name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: main
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl]

    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
        working-directory: .
      - name: Add Linux target
        run: rustup target add ${{ matrix.target }}
      - name: Build ${{ matrix.target }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename Linux binary
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mv target/${{ matrix.target }}/release/rsctl ../rsctl-v${VERSION}-linux-x86_64
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsctl-linux
          path: rsctl-v*-linux-x86_64
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: main
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
      - name: Add macOS targets
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin
      - name: Build macOS x86_64
        run: cargo build --release --target x86_64-apple-darwin
      - name: Build macOS ARM64
        run: cargo build --release --target aarch64-apple-darwin
      - name: Rename macOS binaries
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mv target/x86_64-apple-darwin/release/rsctl ../rsctl-v${VERSION}-macos-x86_64
          mv target/aarch64-apple-darwin/release/rsctl ../rsctl-v${VERSION}-macos-arm64
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rsctl-macos
          path: |
            rsctl-v*-macos-x86_64
            rsctl-v*-macos-arm64
